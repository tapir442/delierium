[tox]
min_version = 4

requires =
    virtualenv
    pluggy

envlist = type pytest

[testenv]
deps=pytest
allowlist_externals = pytest
commands =
    pytest tests {posargs}
passenv =
    HOME

[pytest]
minversion = 6.0
addopts = -ra -q --import-mode=importlib
testpaths =  tests
pythonpath = . src


[testenv:type]
deps = mypy
commands = mypy src

[flake8]
max-line-length = 100
extend-ignore = E203,W503
per-file-ignores =
    tests/*: F401