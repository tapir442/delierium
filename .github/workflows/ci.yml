name: CI

on:
  push:
    branches: [main]
    # a version tag (1.0.2) publishes the release, see the job publish
    tags: ["[0-9]*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --group test
      - run: uv run pytest -n auto --cov --cov-report=term

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # the extras: pylint and mypy check the lazy imports of the optional
      # dependencies (IPython, matplotlib, numpy, line_profiler) as well
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run pylint src/delierium
      - run: uv run mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # PyPI trusted publishing, no API token: on pypi.org the project has this
  # repository, the workflow ci.yml and the environment pypi as its trusted
  # publisher
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/delierium/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: The tag is the version of the package
        run: |
          ls dist/
          test -f "dist/delierium-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/delierium-${GITHUB_REF_NAME}-py3-none-any.whl"
      - uses: pypa/gh-action-pypi-publish@release/v1
